# =========================================================
# HOSSEIN ALAVI BLOG CMS
# =========================================================


# =========================================================
# BACKEND
# =========================================================

backend:
  name: turbo-github
  turbo_site_id: cd26d520-546a-44ae-8846-36aa071481f7
  branch: main


# =========================================================
# WEBSITE
# =========================================================

site_url: "https://hosseinalavifarzin.ir"

display_url: "https://hosseinalavifarzin.ir"

publish_mode: simple

show_preview_links: false


# =========================================================
# MEDIA
# =========================================================

media_folder: "public/blog/media"

public_folder: "/blog/media"


# =========================================================
# IMAGE PROCESSING
# =========================================================

media_processing:
  enabled: true

  format:
    enabled: true
    default: webp

  quality: 84

  strip_metadata: true

  width: 1800

  height: null


# =========================================================
# SLUG
# =========================================================

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"


# =========================================================
# COLLECTIONS
# =========================================================

collections:

  - name: "articles"

    label: "Blog Articles"

    label_singular: "Blog Article"

    description: "Create and manage Persian and English Product Design articles."

    folder: "content/blog"

    create: true

    extension: "json"

    format: "json"

    identifier_field: "slug"

    slug: "{{fields.slug}}"

    summary: "{{fields.slug}}"

    editor:
      preview: false


    fields:

      # ===================================================
      # SLUG
      # ===================================================

      - label: "Slug"

        name: "slug"

        widget: "string"

        hint: "English only. Example: product-design-problem-space"

        pattern:
          - "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          - "Use lowercase English letters, numbers and hyphens only."


      # ===================================================
      # CATEGORY
      # ===================================================

      - label: "Category"

        name: "category"

        widget: "select"

        default: "problem-framing"

        options:

          - label: "Product Discovery"
            value: "product-discovery"

          - label: "User Research"
            value: "user-research"

          - label: "Problem Framing"
            value: "problem-framing"

          - label: "Product Thinking"
            value: "product-thinking"

          - label: "Design Systems"
            value: "design-systems"


      # ===================================================
      # FEATURED
      # ===================================================

      - label: "Featured Article"

        name: "featured"

        widget: "boolean"

        default: false

        required: false


      # ===================================================
      # PUBLISH DATE
      # ===================================================

      - label: "Publish Date"

        name: "publishedAt"

        widget: "datetime"

        required: false

        date_format: "YYYY-MM-DD"

        time_format: false

        format: "YYYY-MM-DD"

        hint: "Set the real publication date. Leave empty until the article is actually published."


      # ===================================================
      # AUTHOR
      # ===================================================

      - label: "Author"

        name: "author"

        widget: "hidden"

        default: "Hossein Alavi"


      # ===================================================
      # COVER
      # ===================================================

      - label: "Cover Image"

        name: "cover"

        widget: "image"

        required: false

        choose_url: false

        hint: "Used for the Blog card, article hero and social sharing."

        media_library:

          config:

            multiple: false

            max_file_size: 8388608


      # ===================================================
      # PERSIAN
      # ===================================================

      - label: "Persian Version"

        name: "fa"

        widget: "object"

        collapsed: false


        fields:

          - label: "Enable Persian"

            name: "enabled"

            widget: "boolean"

            default: true


          - label: "Persian Description"

            name: "description"

            widget: "text"

            required: false

            hint: "Short summary. Used automatically for the Blog card, meta description, Open Graph and structured data."


          - label: "Persian Article"

            name: "body"

            widget: "richtext"

            required: false

            minimal: false

            modes:
              - rich_text
              - raw

            buttons:
              - bold
              - italic
              - strikethrough
              - code
              - link
              - heading-two
              - heading-three
              - heading-four
              - quote
              - bulleted-list
              - numbered-list

            editor_components:
              - image
              - code-block

            hint: "Start the article with one H1. That H1 automatically becomes the article title and SEO title."


      # ===================================================
      # ENGLISH
      # ===================================================

      - label: "English Version"

        name: "en"

        widget: "object"

        collapsed: true


        fields:

          - label: "Enable English"

            name: "enabled"

            widget: "boolean"

            default: false


          - label: "English Description"

            name: "description"

            widget: "text"

            required: false

            hint: "Short summary. Used automatically for the Blog card, meta description, Open Graph and structured data."


          - label: "English Article"

            name: "body"

            widget: "richtext"

            required: false

            minimal: false

            modes:
              - rich_text
              - raw

            buttons:
              - bold
              - italic
              - strikethrough
              - code
              - link
              - heading-two
              - heading-three
              - heading-four
              - quote
              - bulleted-list
              - numbered-list

            editor_components:
              - image
              - code-block

            hint: "Start the article with one H1. That H1 automatically becomes the article title and SEO title."