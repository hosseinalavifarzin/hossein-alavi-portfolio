<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <meta name="theme-color" content="#11111b" />

    <!-- Primary SEO -->
    <title>Hossein Alavi | Product Designer</title>

    <meta
      name="description"
      content="Portfolio of Hossein Alavi, a Product Designer focused on UX, product strategy, design systems, B2B platforms, travel products, and complex digital experiences."
    />

    <meta name="author" content="Hossein Alavi" />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large"
    />

    <!-- Canonical -->
    <link
      rel="canonical"
      href="https://hosseinalavifarzin.ir/"
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />

    <meta
      property="og:url"
      content="https://hosseinalavifarzin.ir/"
    />

    <meta
      property="og:title"
      content="Hossein Alavi | Product Designer"
    />

    <meta
      property="og:description"
      content="Portfolio of Hossein Alavi, a Product Designer focused on UX, product strategy, design systems, and complex digital products."
    />

    <meta
      property="og:site_name"
      content="Hossein Alavi Portfolio"
    />

    <meta property="og:locale" content="en_US" />

    <!-- Twitter / Social Sharing -->
    <meta
      name="twitter:card"
      content="summary"
    />

    <meta
      name="twitter:title"
      content="Hossein Alavi | Product Designer"
    />

    <meta
      name="twitter:description"
      content="Portfolio of Hossein Alavi, a Product Designer focused on UX, product strategy, design systems, and complex digital products."
    />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Hossein Alavi",
        "url": "https://hosseinalavifarzin.ir/",
        "jobTitle": "Product Designer",
        "description": "Product Designer focused on UX, product strategy, design systems, B2B platforms, travel products, and complex digital experiences."
      }
    </script>

    <!-- Icons -->
    <link
      rel="icon"
      href="%PUBLIC_URL%/favicon.svg"
      type="image/svg+xml"
    />

    <link
      rel="apple-touch-icon"
      href="%PUBLIC_URL%/logo192.png"
    />

    <link
      rel="manifest"
      href="%PUBLIC_URL%/manifest.json"
    />
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>

    <div id="root"></div>
  </body>
</html>
